name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      # The branch model routes day-to-day PRs here, so gating only on main meant
      # the build and unit tests never ran on a real PR.
      - development
      # Stacked PRs (AGENTS.md): without this, a child PR or an upper super is never compiled.
      - 'super/**'

jobs:
  checks:
    # Cheap repo checks that need no Mac: the pinned OpenSpec CLI validates every spec and change,
    # and the pre-commit hook runs its invariant checks on the checked-out tree. Nothing is staged in
    # a checkout, so the hook's CHANGELOG check cannot fire here; it still needs the local hook.
    name: OpenSpec and hook
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set Up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate OpenSpec
        env:
          OPENSPEC_TELEMETRY: '0'
        run: npx -y @fission-ai/openspec@0.23.0 validate --all --strict --no-interactive

      - name: Run Pre-commit Hook
        run: bash .githooks/pre-commit

  build:
    name: Build
    strategy:
      matrix:
        # macos-14 runners cap at Xcode 16.2 (Swift 6.0); the app source needs Swift 6.1+.
        macos_version: [macos-15, macos-26]
      fail-fast: false
    runs-on: ${{ matrix.macos_version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Metal Toolchain
        # The downloadable Metal Toolchain is an Xcode 26+ (macOS 26) component; older Xcode ships metal.
        run: |
          sudo xcodebuild -runFirstLaunch || true
          MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          if [ "$MAJOR" -ge 26 ]; then
            downloaded=false
            for i in 1 2 3 4 5; do
              if sudo xcodebuild -downloadComponent MetalToolchain; then downloaded=true; break; fi
              sleep 10
            done
            if [ "$downloaded" = false ] && ! xcrun -f metal >/dev/null 2>&1; then
              echo "::error::Metal Toolchain download failed after 5 attempts and metal is unavailable."
              exit 1
            fi
          else
            echo "macOS $MAJOR: Metal ships with Xcode, skipping download."
          fi

      - name: Build
        # UI automation of the notch/accessory app is not driveable on headless
        # GitHub-hosted runners, so CI compiles the app instead of running XCUITest.
        run: |
          sudo DevToolsSecurity -enable

          xcodebuild build \
            -project Kannu.xcodeproj \
            -scheme Kannu \
            -destination "platform=macOS" \
            -resultBundlePath BuildResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES

      - name: Unit Tests
        run: |
          # Logic tests only. The UI test target needs a signed, launchable app bundle and a
          # real session, so it stays out of CI; KannuTests is a pure logic target and runs
          # anywhere. Without this step a broken unit test never fails the build.
          xcodebuild test \
            -project Kannu.xcodeproj \
            -scheme KannuTests \
            -destination "platform=macOS" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Surface Failure Diagnostics
        if: failure()
        run: |
          echo "===== build failure summary ====="
          xcrun xcresulttool get build-results --path BuildResults.xcresult 2>/dev/null \
            || xcrun xcresulttool get --path BuildResults.xcresult --format json 2>/dev/null | head -c 20000 \
            || echo "No xcresult available."

      - name: Upload Build Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-results-${{ matrix.macos_version }}
          path: BuildResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
