name: SonarCloud

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read
  pull-requests: write

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: macos-15
    # Fork PRs cannot use repository secrets (SONAR_TOKEN); skip rather than fail noisily.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode Version
        # Same Xcode as ci.yml's Build job, so coverage comes from the toolchain the tests already pass on.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Unit Tests With Coverage
        # KannuTests is the pure logic target ci.yml already runs. Without a coverage report Sonar reads
        # every new Swift line as uncovered, so its new-code coverage condition fails by construction.
        # derivedData sits under .build-coverage, which sonar.exclusions (**/.build*/**) keeps out of the scan.
        run: |
          xcodebuild test \
            -project Kannu.xcodeproj \
            -scheme KannuTests \
            -destination "platform=macOS" \
            -derivedDataPath .build-coverage \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Convert Coverage For Sonar
        # Reads TestResults.xcresult and writes sonar-coverage.xml, both fixed in the script.
        run: python3 -I scripts/xccov-to-sonar.py

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.sourceEncoding=UTF-8
