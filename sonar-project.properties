sonar.organization=yanc-kannu
sonar.projectKey=YANC-Kannu_kannu-macos

sonar.sources=Kannu,scripts
sonar.tests=KannuTests

sonar.exclusions=**/Assets.xcassets/**,**/*.xcassets/**,**/DynamicIslandSamples/**,Kannu/Kannu/**,**/.build*/**,**/.github/**

sonar.python.version=3.13

# Written by scripts/xccov-to-sonar.py from the KannuTests run in .github/workflows/sonarcloud.yml.
sonar.coverageReportPaths=sonar-coverage.xml
# Scanned but not counted for coverage: SwiftUI views get no unit tests (AGENTS.md, "Testing"), and nothing
# measures coverage for the scripts (Python and shell).
# The 80% new-code coverage condition lives in SonarCloud's quality gate, not here; it stays at 80% (2026-11-17).
sonar.coverage.exclusions=Kannu/components/**,scripts/**
