# SonarCloud automatic analysis (there is no CI scanner): the settings it reads from the repository.
#
# KeychainReader.swift is the one place Kannu creates a Keychain item (`KeychainWritePlanTests`
# pins that). Sonar's rule swift:S6288 asks every item to require user authentication on each read.
# Kannu reads its tokens in the background (usage refreshes, task syncs), where no prompt can be
# answered, so its items are readable while the Mac is unlocked, on this device only, with an access
# list that trusts only Kannu — a deliberate choice, explained on the attribute in the file (#84).
#
# Automatic analysis ignores `// NOSONAR` for this rule and offers no per-rule ignore here, so the
# file is left out of Sonar's analysis instead. What guards it: KeychainWritePlanTests (fresh items
# only, never an in-place update, Kannu-owned services only, delete before add, the prior value put
# back), IntegrationSecretRulesTests (no Keychain access from views or on a page appearing), and
# CodeRabbit's reviews. To analyse it again, delete this line and mark S6288 "Accepted" on
# sonarcloud.io instead.
sonar.exclusions=Kannu/managers/LLMUsage/Quota/KeychainReader.swift
